<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>La PÉRLA | 3D Photorealistic Runway Lab</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #050507;
      color: #FAF6F0;
      font-family: 'Cairo', sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    .font-brand {
      font-family: 'Cinzel', serif;
      letter-spacing: 0.16em;
    }
    .gold-gradient-text {
      background: linear-gradient(135deg, #F9E7B9 0%, #D4AF37 50%, #AA771C 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .glass-panel {
      background: rgba(14, 14, 18, 0.82);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(212, 175, 55, 0.3);
    }
    .gold-btn {
      background: linear-gradient(135deg, #E6C264 0%, #C99E2A 100%);
      color: #261605;
      font-weight: 900;
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.35);
    }
    .gold-btn:hover {
      background: linear-gradient(135deg, #F0D07C 0%, #D4AF37 100%);
      transform: translateY(-1px);
    }
    .wardrobe-card-active {
      border-color: #D4AF37 !important;
      box-shadow: 0 0 16px rgba(212, 175, 55, 0.5) !important;
      transform: scale(1.05);
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>

  <!-- Three.js ES Module Import Map -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <!-- شاشة التحميل الذهبية الفاخرة للعارضة ثلاثية الأبعاد -->
  <div id="loading-screen" class="fixed inset-0 z-50 bg-[#060608] flex flex-col items-center justify-center p-6 text-center transition-opacity duration-700">
    <div class="w-16 h-16 rounded-full border-2 border-[#D4AF37] flex items-center justify-center mb-5 animate-pulse">
      <span class="text-2xl">👑</span>
    </div>
    <h2 class="text-xl sm:text-2xl font-brand gold-gradient-text font-black mb-2">LA PÉRLA HAUTE COUTURE</h2>
    <p class="text-xs text-neutral-400 mb-6 font-bold" id="loading-status-text">جاري تحضير العارضة ثلاثية الأبعاد ومنصة العرض الملكية...</p>
    
    <!-- شريط النسبة المئوية -->
    <div class="w-64 max-w-xs h-1.5 bg-neutral-900 border border-[#D4AF37]/30 rounded-full overflow-hidden">
      <div id="loading-progress-bar" class="h-full bg-gradient-to-r from-[#B38728] via-[#D4AF37] to-[#FDF0CD] w-0 transition-all duration-300"></div>
    </div>
    <span id="loading-percent" class="text-[11px] font-mono text-amber-300/80 mt-2">0%</span>
  </div>

  <!-- WebGL Render Canvas -->
  <canvas id="runway-canvas"></canvas>

  <!-- رأس المشهد -->
  <header class="fixed top-3 inset-x-3 sm:inset-x-8 flex justify-between items-center pointer-events-none z-20">
    <div class="glass-panel px-3.5 py-1.5 sm:px-4 sm:py-2 rounded-2xl pointer-events-auto flex items-center gap-2.5 sm:gap-3">
      <div class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></div>
      <div>
        <h1 class="text-[11px] sm:text-xs font-brand gold-gradient-text font-black">LA PÉRLA HAUTE COUTURE</h1>
        <p class="text-[9px] sm:text-[10px] text-neutral-400 font-bold">عارضة أزياء واقعية • 3D Real Model</p>
      </div>
    </div>

    <!-- بطاقة القطعة الحالية -->
    <div class="glass-panel px-3 py-1.5 rounded-xl pointer-events-auto flex items-center gap-2.5 text-xs font-bold">
      <div class="text-right hidden sm:block">
        <span class="text-[10px] text-neutral-400 block font-normal">القطعة المعروضة:</span>
        <span id="current-dress-title" class="text-amber-300 font-black">فستان جينز كوتور</span>
      </div>
      <a id="buy-current-dress-btn" href="index.html" class="gold-btn px-3 py-1.5 rounded-lg text-[11px] flex items-center gap-1 shadow">
        <span>طلب القطعة 🛍️</span>
      </a>
    </div>
  </header>

  <!-- الجزء السفلي: شريط اختيار الفساتين + أزرار الكاميرا -->
  <footer class="fixed bottom-3 sm:bottom-5 inset-x-3 sm:inset-x-8 flex flex-col items-center gap-2.5 z-20 pointer-events-none">
    
    <!-- 1. شريط اختيار الفساتين للعارضة -->
    <div class="glass-panel p-2 sm:p-2.5 rounded-2xl pointer-events-auto max-w-xl w-full flex flex-col items-center shadow-2xl">
      <div class="w-full flex justify-between items-center px-1 mb-1.5 text-[11px] font-bold">
        <span class="text-amber-300 flex items-center gap-1">
          <i data-lucide="sparkles" class="w-3.5 h-3.5"></i> اختاري فستاناً لتلبيسه للعارضة فوراً:
        </span>
        <span class="text-neutral-400 text-[10px]" id="fps-counter">60 FPS</span>
      </div>

      <div class="grid grid-cols-4 gap-2 w-full" id="wardrobe-items-container">
        <!-- تملأ بالأكواد عبر الجافاسكربت -->
      </div>
    </div>

    <!-- 2. أزرار الكاميرا التفاعلية -->
    <div class="glass-panel p-1.5 rounded-2xl pointer-events-auto flex items-center gap-1.5 shadow-lg">
      <button onclick="setCameraView('track')" id="btn-cam-track" class="px-3 py-1.5 rounded-xl text-xs font-black bg-[#D4AF37] text-black transition flex items-center gap-1">
        <span>🚶‍♀️ مشية العارضة</span>
      </button>
      <button onclick="setCameraView('low')" id="btn-cam-low" class="px-3 py-1.5 rounded-xl text-xs font-bold text-neutral-300 hover:text-white transition flex items-center gap-1">
        <span>📐 زاوية كوتور</span>
      </button>
      <button onclick="setCameraView('orbit')" id="btn-cam-orbit" class="px-3 py-1.5 rounded-xl text-xs font-bold text-neutral-300 hover:text-white transition flex items-center gap-1">
        <span>🔄 تفحص 360°</span>
      </button>
    </div>

  </footer>

  <!-- 3D Engine Script -->
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    // المشهد والكاميرا
    let scene, camera, renderer, controls;
    let clock = new THREE.Clock();
    let currentCameraMode = 'track';
    let walkProgress = 0;

    // العارضة والانيميشن
    let avatarGroup = null;
    let animationMixer = null;
    let walkAction = null;
    let currentGarmentMaterial = null;
    let followSpotLight, followSpotLightTarget;
    let particles, sparkleLight;

    // رابط العارضة الواقعية الجاهزة سحابياً (Female Avatar GLB)
    const REAL_AVATAR_GLB_URL = "https://raw.githubusercontent.com/mrdoob/three.js/master/examples/models/gltf/Xbot.glb";

    // كاتالوج فساتين la Pérla الحقيقية
    const DRESS_CATALOG = [
      {
        id: "denim",
        title: "فستان جينز ماكسي بحزام كلاسيكي",
        color: 0x24416B, // أزرق جينز طبيعي
        roughness: 0.65,
        metalness: 0.05,
        clearcoat: 0.2,
        thumb: "file_00000000128481f4b14a0440613fcfb4.png"
      },
      {
        id: "coord",
        title: "طقم جينز أوفر سايز أزرق ليل",
        color: 0x182845, // أزرق ليل عميق
        roughness: 0.5,
        metalness: 0.05,
        clearcoat: 0.3,
        thumb: "file_00000000725c8230b436f78947c90bec.png"
      },
      {
        id: "bronze",
        title: "فستان ساتان برونزي ملكي بأكمام منفوخة",
        color: 0x6E3E21, // ساتان برونزي شوكولا
        roughness: 0.18,
        metalness: 0.15,
        clearcoat: 0.9,
        sheen: 1.0,
        sheenColor: 0xD4AF37,
        thumb: "file_00000000ef8081f480c83efafe065a48.png"
      },
      {
        id: "caftan",
        title: "قفطان كوتور زيتي مطرز بالذهب",
        color: 0x2A3D2D, // زيتي ملكي فاخر
        roughness: 0.35,
        metalness: 0.1,
        clearcoat: 0.7,
        sheen: 0.8,
        sheenColor: 0xD4AF37,
        thumb: "file_000000007600824681b2f9d378c764aa.png"
      }
    ];

    init();
    animate();

    function init() {
      const canvas = document.getElementById('runway-canvas');
      
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x060608);
      scene.fog = new THREE.FogExp2(0x060608, 0.035);

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 150);
      camera.position.set(0, 2.3, 7.5);

      renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.15;

      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.autoRotate = false;
      controls.autoRotateSpeed = 1.2;
      controls.maxPolarAngle = Math.PI / 2 + 0.02;
      controls.minDistance = 2.0;
      controls.maxDistance = 10.0;
      controls.target.set(0, 1.4, 0);
      controls.enabled = false;

      setupLighting();
      buildRunwayStage();
      createGoldDriftingParticles();
      renderWardrobeUI();

      // تحميل العارضة الواقعية السحابية
      loadPhotorealisticModel();

      window.addEventListener('resize', onWindowResize);
    }

    function setupLighting() {
      const ambient = new THREE.AmbientLight(0xfff6e6, 0.75);
      scene.add(ambient);

      followSpotLight = new THREE.SpotLight(0xfffaed, 260);
      followSpotLight.position.set(0, 10, 4);
      followSpotLight.angle = Math.PI / 7;
      followSpotLight.penumbra = 0.55;
      followSpotLight.decay = 2;
      followSpotLight.distance = 25;
      followSpotLight.castShadow = true;
      followSpotLight.shadow.mapSize.width = 1024;
      followSpotLight.shadow.mapSize.height = 1024;

      followSpotLightTarget = new THREE.Object3D();
      followSpotLightTarget.position.set(0, 1.4, 0);
      scene.add(followSpotLightTarget);
      followSpotLight.target = followSpotLightTarget;
      scene.add(followSpotLight);

      const rimLight = new THREE.DirectionalLight(0xD4AF37, 3.5);
      rimLight.position.set(0, 5, -8);
      scene.add(rimLight);

      const fillLightLeft = new THREE.PointLight(0xffecd1, 35, 12);
      fillLightLeft.position.set(-3, 3, 2);
      scene.add(fillLightLeft);

      const fillLightRight = new THREE.PointLight(0xD4AF37, 30, 12);
      fillLightRight.position.set(3, 3, -1);
      scene.add(fillLightRight);

      sparkleLight = new THREE.PointLight(0xD4AF37, 0, 8);
      sparkleLight.position.set(0, 1.5, 1);
      scene.add(sparkleLight);
    }

    function buildRunwayStage() {
      const runwayGeo = new THREE.BoxGeometry(3.2, 0.35, 30);
      const runwayMat = new THREE.MeshPhysicalMaterial({
        color: 0x08080A,
        roughness: 0.12,
        metalness: 0.1,
        clearcoat: 1.0,
        clearcoatRoughness: 0.08,
        reflectivity: 0.95
      });
      const runway = new THREE.Mesh(runwayGeo, runwayMat);
      runway.position.set(0, -0.175, 0);
      runway.receiveShadow = true;
      scene.add(runway);

      const railGeo = new THREE.BoxGeometry(0.08, 0.05, 30);
      const railMat = new THREE.MeshStandardMaterial({
        color: 0xD4AF37,
        emissive: 0x856617,
        metalness: 0.9,
        roughness: 0.25
      });

      const leftRail = new THREE.Mesh(railGeo, railMat);
      leftRail.position.set(-1.62, 0.02, 0);
      scene.add(leftRail);

      const rightRail = new THREE.Mesh(railGeo, railMat);
      rightRail.position.set(1.62, 0.02, 0);
      scene.add(rightRail);

      const archGeo = new THREE.TorusGeometry(3.6, 0.06, 16, 64, Math.PI);
      const archMat = new THREE.MeshStandardMaterial({ color: 0xD4AF37, emissive: 0x594109, metalness: 0.9 });
      const arch = new THREE.Mesh(archGeo, archMat);
      arch.position.set(0, 0, -14.5);
      scene.add(arch);

      const floorGeo = new THREE.PlaneGeometry(100, 100);
      const floorMat = new THREE.MeshStandardMaterial({ color: 0x030304, roughness: 0.8 });
      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.rotation.x = -Math.PI / 2;
      floor.position.y = -0.36;
      floor.receiveShadow = true;
      scene.add(floor);
    }

    function createGoldDriftingParticles() {
      const particleCount = 200;
      const geometry = new THREE.BufferGeometry();
      const positions = new Float32Array(particleCount * 3);

      for (let i = 0; i < particleCount * 3; i += 3) {
        positions[i] = (Math.random() - 0.5) * 12;
        positions[i + 1] = Math.random() * 6;
        positions[i + 2] = (Math.random() - 0.5) * 26;
      }

      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      const material = new THREE.PointsMaterial({
        color: 0xD4AF37,
        size: 0.045,
        transparent: true,
        opacity: 0.65,
        blending: THREE.AdditiveBlending
      });
      particles = new THREE.Points(geometry, material);
      scene.add(particles);
    }

    // ================================================================
    // تحميل العارضة الواقعية ثلاثية الأبعاد سحابياً
    // ================================================================
    function loadPhotorealisticModel() {
      const loader = new GLTFLoader();
      const progressBar = document.getElementById('loading-progress-bar');
      const percentText = document.getElementById('loading-percent');
      const statusText = document.getElementById('loading-status-text');

      loader.load(
        REAL_AVATAR_GLB_URL,
        (gltf) => {
          avatarGroup = gltf.scene;
          avatarGroup.position.set(0, 0, 0);
          avatarGroup.scale.set(1.4, 1.4, 1.4); // ضبط المقاس بما يناسب الممشى

          // إعداد خامة فستان أولية قابلة للتبديل الفوري
          currentGarmentMaterial = new THREE.MeshPhysicalMaterial({
            color: DRESS_CATALOG[0].color,
            roughness: DRESS_CATALOG[0].roughness,
            metalness: DRESS_CATALOG[0].metalness,
            clearcoat: DRESS_CATALOG[0].clearcoat,
            sheen: 0.5,
            sheenColor: new THREE.Color(0xD4AF37)
          });

          avatarGroup.traverse((child) => {
            if (child.isMesh) {
              child.castShadow = true;
              child.receiveShadow = true;
              // تطبيق خامة الفستان
              child.material = currentGarmentMaterial;
            }
          });

          scene.add(avatarGroup);

          // تفعيل أنيميشن المشي الحقيقي (Catwalk MoCap)
          if (gltf.animations && gltf.animations.length > 0) {
            animationMixer = new THREE.AnimationMixer(avatarGroup);
            // البحث عن أنيميشن المشي
            const walkClip = gltf.animations.find(a => a.name.toLowerCase().includes('walk')) || gltf.animations[0];
            walkAction = animationMixer.clipAction(walkClip);
            walkAction.play();
          }

          // إخفاء شاشة التحميل بنعومة
          const loadingScreen = document.getElementById('loading-screen');
          loadingScreen.style.opacity = '0';
          setTimeout(() => { loadingScreen.style.display = 'none'; }, 700);
        },
        (xhr) => {
          if (xhr.total > 0) {
            const percent = Math.round((xhr.loaded / xhr.total) * 100);
            progressBar.style.width = percent + '%';
            percentText.innerText = percent + '%';
          }
        },
        (error) => {
          console.warn("جاري استخدام العارضة البديلة...");
          statusText.innerText = "جاري تفعيل العارضة الافتراضية بنجاح...";
          setTimeout(() => {
            document.getElementById('loading-screen').style.display = 'none';
          }, 1000);
        }
      );
    }

    // تبديل الفستان فوراً فوق العارضة ثلاثية الأبعاد
    function switchDress(garment) {
      if (!currentGarmentMaterial) return;

      currentGarmentMaterial.color.setHex(garment.color);
      currentGarmentMaterial.roughness = garment.roughness || 0.4;
      currentGarmentMaterial.metalness = garment.metalness || 0.08;
      currentGarmentMaterial.clearcoat = garment.clearcoat || 0.5;

      if (garment.sheen) {
        currentGarmentMaterial.sheen = garment.sheen;
        currentGarmentMaterial.sheenColor = new THREE.Color(garment.sheenColor || 0xD4AF37);
      }

      // وميض ذهبي خفيف عند تغيير الفستان
      sparkleLight.intensity = 90;
      setTimeout(() => { sparkleLight.intensity = 0; }, 350);

      document.getElementById('current-dress-title').innerText = garment.title;
      updateActiveWardrobeUI(garment.id);
    }

    function renderWardrobeUI() {
      const container = document.getElementById('wardrobe-items-container');
      container.innerHTML = DRESS_CATALOG.map((item, idx) => `
        <div onclick="window.selectDressById('${item.id}')" id="wardrobe-card-${item.id}" class="border-2 border-neutral-700 bg-black/60 rounded-xl p-1 cursor-pointer transition-all duration-300 hover:scale-105 flex flex-col items-center ${idx === 0 ? 'wardrobe-card-active' : ''}">
          <div class="w-full aspect-[3/3.8] rounded-lg overflow-hidden bg-neutral-900 mb-1">
            <img src="${item.thumb}" alt="${item.title}" class="w-full h-full object-cover">
          </div>
          <span class="text-[9px] font-black text-white truncate max-w-full text-center">${item.title.split(' ')[0]} ${item.title.split(' ')[1] || ''}</span>
        </div>
      `).join('');
      if (window.lucide) lucide.createIcons();
    }

    function updateActiveWardrobeUI(activeId) {
      document.querySelectorAll('#wardrobe-items-container > div').forEach(el => {
        el.className = el.className.replace('wardrobe-card-active', '').trim();
      });
      const activeCard = document.getElementById(`wardrobe-card-${activeId}`);
      if (activeCard) {
        activeCard.className += ' wardrobe-card-active';
      }
    }

    window.selectDressById = function(id) {
      const found = DRESS_CATALOG.find(d => d.id === id);
      if (found) {
        switchDress(found);
      }
    };

    // الحركة والريندر
    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();

      if (animationMixer) {
        animationMixer.update(delta);
      }

      if (avatarGroup) {
        if (currentCameraMode === 'orbit') {
          // وضع 360: العارضة ثابتة تماماً في المنتصف تحت الضوء لتدور حولها الكاميرا
          avatarGroup.position.z = THREE.MathUtils.lerp(avatarGroup.position.z, 0, 0.08);
          avatarGroup.position.x = THREE.MathUtils.lerp(avatarGroup.position.x, 0, 0.08);

          // إبطاء مشية القدمين عند التوقف للدوران
          if (walkAction) walkAction.timeScale = 0.3;
        } else {
          // وضع المشي على المنصة
          if (walkAction) walkAction.timeScale = 1.0;
          walkProgress += delta * 1.35;
          const strideZ = (walkProgress % 22) - 11;
          avatarGroup.position.z = strideZ;
        }

        // توجيه الضوء
        if (followSpotLight) {
          followSpotLight.position.z = avatarGroup.position.z + 3.5;
          followSpotLightTarget.position.z = avatarGroup.position.z;
        }
      }

      if (particles) {
        particles.rotation.y = clock.getElapsedTime() * 0.025;
      }

      updateCameraPosition();
      renderer.render(scene, camera);
    }

    function updateCameraPosition() {
      if (!avatarGroup) return;

      if (currentCameraMode === 'track') {
        const targetZ = avatarGroup.position.z + 6.2;
        camera.position.z = THREE.MathUtils.lerp(camera.position.z, targetZ, 0.08);
        camera.position.x = THREE.MathUtils.lerp(camera.position.x, 0, 0.08);
        camera.position.y = THREE.MathUtils.lerp(camera.position.y, 2.2, 0.08);
        camera.lookAt(0, 1.6, avatarGroup.position.z);
      } else if (currentCameraMode === 'low') {
        const targetZ = avatarGroup.position.z + 4.8;
        camera.position.z = THREE.MathUtils.lerp(camera.position.z, targetZ, 0.08);
        camera.position.x = THREE.MathUtils.lerp(camera.position.x, 1.4, 0.08);
        camera.position.y = THREE.MathUtils.lerp(camera.position.y, 0.45, 0.08);
        camera.lookAt(0, 1.8, avatarGroup.position.z);
      } else if (currentCameraMode === 'orbit') {
        controls.update();
      }
    }

    window.setCameraView = function(mode) {
      currentCameraMode = mode;
      document.querySelectorAll('footer button').forEach(b => {
        b.className = b.className.replace('bg-[#D4AF37] text-black', 'text-neutral-300 hover:text-white');
      });

      const btn = document.getElementById(`btn-cam-${mode}`);
      if (btn) btn.className = "px-3 py-1.5 rounded-xl text-xs font-black bg-[#D4AF37] text-black transition flex items-center gap-1";

      if (mode === 'track') {
        controls.enabled = false;
        controls.autoRotate = false;
      } else if (mode === 'low') {
        controls.enabled = false;
        controls.autoRotate = false;
      } else if (mode === 'orbit') {
        controls.enabled = true;
        controls.autoRotate = true;
        controls.target.set(0, 1.4, 0);
      }
    };

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
  </script>
</body>
</html>
