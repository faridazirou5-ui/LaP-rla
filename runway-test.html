<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>La PÉRLA | Grand Runway & Virtual Dressing Room</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Playfair+Display:ital,wght@0,600;0,800;1,400&family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #030305;
      color: #FAF6F0;
      font-family: 'Cairo', sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    .font-brand {
      font-family: 'Cinzel', serif;
      letter-spacing: 0.16em;
    }
    .font-serif-luxury {
      font-family: '"Playfair Display"', serif;
    }
    .gold-gradient-text {
      background: linear-gradient(135deg, #F9E7B9 0%, #D4AF37 50%, #AA771C 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .glass-panel {
      background: rgba(12, 12, 16, 0.82);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(212, 175, 55, 0.35);
    }
    .gold-btn {
      background: linear-gradient(135deg, #E6C264 0%, #C99E2A 100%);
      color: #1A1207;
      font-weight: 900;
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.35);
    }
    .gold-btn:hover {
      background: linear-gradient(135deg, #F0D07C 0%, #D4AF37 100%);
      transform: translateY(-1px);
    }
    .wardrobe-card-active {
      border-color: #D4AF37 !important;
      box-shadow: 0 0 16px rgba(212, 175, 55, 0.55) !important;
      transform: scale(1.05);
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    /* وميض فلاش التصوير */
    #paparazzi-flash {
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.08s ease-out;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <!-- شاشة التحميل الفاخرة أثناء جلب المجسم الحقيقي -->
  <div id="luxury-loader" class="fixed inset-0 z-50 bg-[#060608] flex flex-col items-center justify-center transition-opacity duration-700">
    <div class="relative w-20 h-20 mb-6 flex items-center justify-center">
      <div class="absolute inset-0 rounded-full border-2 border-[#D4AF37]/20 border-t-[#D4AF37] animate-spin"></div>
      <span class="text-2xl">👑</span>
    </div>
    <h2 class="text-lg font-brand gold-gradient-text font-black tracking-widest mb-2">LA PÉRLA PARIS</h2>
    <p class="text-xs text-neutral-400 font-bold mb-4" id="loader-status">جاري تحضير منصة العرض الملكية والعارضة...</p>
    <div class="w-48 h-1 bg-neutral-800 rounded-full overflow-hidden">
      <div id="loader-progress" class="h-full bg-gradient-to-r from-[#D4AF37] to-[#F9E7B9] w-12 transition-all duration-300"></div>
    </div>
  </div>

  <!-- وميض فلاشات الكاميرا للجمهور -->
  <div id="paparazzi-flash" class="fixed inset-0 z-30 bg-white/30 mix-blend-screen pointer-events-none"></div>

  <!-- WebGL Render Canvas -->
  <canvas id="runway-canvas"></canvas>

  <!-- الشريط العلوي -->
  <header class="fixed top-3 inset-x-3 sm:inset-x-8 flex justify-between items-center pointer-events-none z-20">
    <div class="glass-panel px-3.5 py-1.5 sm:px-4 sm:py-2 rounded-2xl pointer-events-auto flex items-center gap-2.5 sm:gap-3">
      <div class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></div>
      <div>
        <h1 class="text-[11px] sm:text-xs font-brand gold-gradient-text font-black">LA PÉRLA HAUTE COUTURE</h1>
        <p class="text-[9px] sm:text-[10px] text-neutral-400 font-bold">عرض الكات ووك الحي • المنصة الملكية</p>
      </div>
    </div>

    <div class="glass-panel px-3 py-1.5 rounded-xl pointer-events-auto flex items-center gap-2.5 text-xs font-bold">
      <div class="text-right hidden sm:block">
        <span class="text-[10px] text-neutral-400 block font-normal">القطعة المعروضة:</span>
        <span id="current-dress-title" class="text-amber-300 font-black">فستان جينز ماكسي راقٍ</span>
      </div>
      <a id="buy-current-dress-btn" href="index.html" class="gold-btn px-3.5 py-1.5 rounded-lg text-[11px] flex items-center gap-1.5 shadow">
        <span>اقتناء الفستان 🛍️</span>
      </a>
    </div>
  </header>

  <!-- الشريط السفلي التفاعلي -->
  <footer class="fixed bottom-3 sm:bottom-5 inset-x-3 sm:inset-x-8 flex flex-col items-center gap-2.5 z-20 pointer-events-none">
    
    <!-- شريط الفساتين -->
    <div class="glass-panel p-2 sm:p-2.5 rounded-2xl pointer-events-auto max-w-xl w-full flex flex-col items-center shadow-2xl">
      <div class="w-full flex justify-between items-center px-1 mb-1.5 text-[11px] font-bold">
        <span class="text-amber-300 flex items-center gap-1.5">
          <i data-lucide="sparkles" class="w-3.5 h-3.5"></i> بدّلي الفستان على العارضة مباشرة:
        </span>
        <span class="text-neutral-400 text-[10px] font-mono" id="fps-counter">60 FPS</span>
      </div>

      <div class="grid grid-cols-4 gap-2 w-full" id="wardrobe-items-container">
        <!-- تملأ برمجياً -->
      </div>
    </div>

    <!-- أزرار الكاميرا والمشية و 360 -->
    <div class="glass-panel p-1.5 rounded-2xl pointer-events-auto flex items-center gap-1.5 shadow-lg">
      <button onclick="setCameraView('track')" id="btn-cam-track" class="px-3 py-1.5 rounded-xl text-xs font-black bg-[#D4AF37] text-black transition flex items-center gap-1">
        <span>🚶‍♀️ مسار المشي</span>
      </button>
      <button onclick="setCameraView('low')" id="btn-cam-low" class="px-3 py-1.5 rounded-xl text-xs font-bold text-neutral-300 hover:text-white transition flex items-center gap-1">
        <span>📐 كادر سينمائي</span>
      </button>
      <button onclick="setCameraView('orbit')" id="btn-cam-orbit" class="px-3 py-1.5 rounded-xl text-xs font-bold text-neutral-300 hover:text-white transition flex items-center gap-1">
        <span>🔄 تفحص 360°</span>
      </button>
    </div>

  </footer>

  <!-- 3D Engine Script -->
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    let scene, camera, renderer, controls;
    let clock = new THREE.Clock();
    let currentCameraMode = 'track';
    let walkProgress = 0;

    // العارضة ومحرك الانيميشن
    let humanModelGroup, animationMixer, walkAction;
    let garmentMaterials = [];
    let followSpotLight, followSpotLightTarget;
    let particles, screenMesh, screenCanvas, screenCtx, screenTexture;

    // كاتالوج الأزياء الحقيقية
    const DRESS_CATALOG = [
      {
        id: "denim",
        title: "فستان جينز ماكسي بحزام كلاسيكي",
        color: 0x223B60,
        roughness: 0.65,
        metalness: 0.05,
        clearcoat: 0.2,
        sheen: 0.2,
        thumb: "file_00000000128481f4b14a0440613fcfb4.png"
      },
      {
        id: "coord",
        title: "طقم جينز أوفر سايز أزرق ليل",
        color: 0x162238,
        roughness: 0.55,
        metalness: 0.05,
        clearcoat: 0.3,
        sheen: 0.3,
        thumb: "file_00000000725c8230b436f78947c90bec.png"
      },
      {
        id: "bronze",
        title: "فستان ساتان برونزي بأكمام منفوخة",
        color: 0x6E3E21,
        roughness: 0.22,
        metalness: 0.18,
        clearcoat: 0.95,
        sheen: 1.0,
        sheenColor: 0xD4AF37,
        thumb: "file_00000000ef8081f480c83efafe065a48.png"
      },
      {
        id: "caftan",
        title: "قفطان كوتور زيتي مطرز بالذهب",
        color: 0x273928,
        roughness: 0.35,
        metalness: 0.12,
        clearcoat: 0.7,
        sheen: 0.8,
        sheenColor: 0xD4AF37,
        thumb: "file_000000007600824681b2f9d378c764aa.png"
      }
    ];

    let currentActiveDress = DRESS_CATALOG[0];

    init();
    animate();

    function init() {
      const canvas = document.getElementById('runway-canvas');
      
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x040406);
      scene.fog = new THREE.FogExp2(0x040406, 0.026);

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 120);
      camera.position.set(0, 2.2, 7.8);

      renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.25;

      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.autoRotate = false;
      controls.autoRotateSpeed = 1.2;
      controls.maxPolarAngle = Math.PI / 2 + 0.01;
      controls.minDistance = 2.0;
      controls.maxDistance = 11.0;
      controls.target.set(0, 1.4, 0);
      controls.enabled = false;

      setupLighting();
      buildGrandCatwalkArchitecture();
      createGoldDriftingParticles();
      renderWardrobeUI();

      // تحميل العارضة الواقعية السحابية
      loadPhotorealisticModel();

      // فلاشات الكاميرات التلقائية
      triggerRandomPaparazzi();

      window.addEventListener('resize', onWindowResize);
    }

    function setupLighting() {
      const ambient = new THREE.AmbientLight(0xfff5e6, 0.75);
      scene.add(ambient);

      // سبوت لايت المتابعة الرئيسي
      followSpotLight = new THREE.SpotLight(0xfffaee, 280);
      followSpotLight.position.set(0, 11, 4);
      followSpotLight.angle = Math.PI / 6.5;
      followSpotLight.penumbra = 0.6;
      followSpotLight.decay = 2;
      followSpotLight.distance = 28;
      followSpotLight.castShadow = true;
      followSpotLight.shadow.mapSize.width = 1024;
      followSpotLight.shadow.mapSize.height = 1024;

      followSpotLightTarget = new THREE.Object3D();
      followSpotLightTarget.position.set(0, 1.4, 0);
      scene.add(followSpotLightTarget);
      followSpotLight.target = followSpotLightTarget;
      scene.add(followSpotLight);

      // إضاءة خلفية ذهبية لتحديد قوام العارضة (Rim Light)
      const rimLight = new THREE.DirectionalLight(0xD4AF37, 3.5);
      rimLight.position.set(0, 6, -9);
      scene.add(rimLight);

      // إضاءات محيطية جانبية للمنصة
      const warmLight1 = new THREE.PointLight(0xffecd1, 45, 14);
      warmLight1.position.set(-3.5, 4, 3);
      scene.add(warmLight1);

      const goldLight2 = new THREE.PointLight(0xD4AF37, 40, 14);
      goldLight2.position.set(3.5, 4, -2);
      scene.add(goldLight2);
    }

    // ====================================================================
    // عمارة المنصة الفاخرة: شاشة العرض العملاقة + البوابة الملكية + الستائر
    // ====================================================================
    function buildGrandCatwalkArchitecture() {
      // 1. ممر المنصة العاكس اللامع
      const runwayGeo = new THREE.BoxGeometry(3.6, 0.4, 32);
      const runwayMat = new THREE.MeshPhysicalMaterial({
        color: 0x060608,
        roughness: 0.08,
        metalness: 0.15,
        clearcoat: 1.0,
        clearcoatRoughness: 0.05,
        reflectivity: 0.98
      });
      const runway = new THREE.Mesh(runwayGeo, runwayMat);
      runway.position.set(0, -0.2, 0);
      runway.receiveShadow = true;
      scene.add(runway);

      // حواف المنصة المذهبة
      const railGeo = new THREE.BoxGeometry(0.1, 0.06, 32);
      const railMat = new THREE.MeshStandardMaterial({
        color: 0xD4AF37,
        emissive: 0x735713,
        metalness: 0.95,
        roughness: 0.2
      });
      const leftRail = new THREE.Mesh(railGeo, railMat);
      leftRail.position.set(-1.82, 0.03, 0);
      scene.add(leftRail);

      const rightRail = new THREE.Mesh(railGeo, railMat);
      rightRail.position.set(1.82, 0.03, 0);
      scene.add(rightRail);

      // 2. شاشة العرض الخلفية العملاقة التفاعلية (Giant Haute Couture LED Backdrop)
      screenCanvas = document.createElement('canvas');
      screenCanvas.width = 1024;
      screenCanvas.height = 512;
      screenCtx = screenCanvas.getContext('2d');
      screenTexture = new THREE.CanvasTexture(screenCanvas);

      const screenGeo = new THREE.PlaneGeometry(16, 8.5);
      const screenMat = new THREE.MeshBasicMaterial({ map: screenTexture });
      screenMesh = new THREE.Mesh(screenGeo, screenMat);
      screenMesh.position.set(0, 4.2, -15.8);
      scene.add(screenMesh);

      // 3. البوابة المقوسة الملكية من الرخام والذهب
      const archFrameGeo = new THREE.TorusGeometry(3.8, 0.12, 16, 64, Math.PI);
      const goldArchMat = new THREE.MeshStandardMaterial({
        color: 0xD4AF37,
        emissive: 0x473408,
        metalness: 0.9,
        roughness: 0.25
      });
      const archFrame = new THREE.Mesh(archFrameGeo, goldArchMat);
      archFrame.position.set(0, 0.1, -15);
      scene.add(archFrame);

      // أعمدة البوابة الرخامية الكلاسيكية
      const colGeo = new THREE.CylinderGeometry(0.24, 0.26, 7.8, 24);
      const colMat = new THREE.MeshStandardMaterial({ color: 0x1A1817, roughness: 0.4, metalness: 0.2 });
      
      const leftCol = new THREE.Mesh(colGeo, colMat);
      leftCol.position.set(-3.8, 3.8, -15);
      scene.add(leftCol);

      const rightCol = new THREE.Mesh(colGeo, colMat);
      rightCol.position.set(3.8, 3.8, -15);
      scene.add(rightCol);

      // تيجان الأعمدة المذهبة
      const capitalGeo = new THREE.BoxGeometry(0.7, 0.3, 0.7);
      const lCap = new THREE.Mesh(capitalGeo, goldArchMat);
      lCap.position.set(-3.8, 7.6, -15);
      scene.add(lCap);

      const rCap = new THREE.Mesh(capitalGeo, goldArchMat);
      rCap.position.set(3.8, 7.6, -15);
      scene.add(rCap);

      // 4. ستائر مخملية فخمة جانبية (Luxury Velvet Drapes)
      const drapeGeo = new THREE.CylinderGeometry(1.2, 1.4, 9, 20, 1, true, 0, Math.PI);
      const drapeMat = new THREE.MeshStandardMaterial({
        color: 0x420C14, // عنابي مخملي ملكي (Burgundy Velvet)
        roughness: 0.85,
        metalness: 0.05,
        side: THREE.DoubleSide
      });
      
      const leftDrape = new THREE.Mesh(drapeGeo, drapeMat);
      leftDrape.position.set(-5.6, 4.4, -14.8);
      leftDrape.rotation.y = Math.PI / 4;
      scene.add(leftDrape);

      const rightDrape = new THREE.Mesh(drapeGeo, drapeMat);
      rightDrape.position.set(5.6, 4.4, -14.8);
      rightDrape.rotation.y = -Math.PI / 4;
      scene.add(rightDrape);

      // 5. أرضية القاعة الخارجية
      const floorGeo = new THREE.PlaneGeometry(120, 120);
      const floorMat = new THREE.MeshStandardMaterial({ color: 0x020203, roughness: 0.85 });
      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.rotation.x = -Math.PI / 2;
      floor.position.y = -0.41;
      floor.receiveShadow = true;
      scene.add(floor);
    }

    // رسم محتوى الشاشة الخلفية العملاقة بدقة وتوهج
    function updateBackdropScreen(time) {
      if (!screenCtx) return;
      const w = screenCanvas.width;
      const h = screenCanvas.height;

      // خلفية داكنة فخمة متدرجة
      const grad = screenCtx.createRadialGradient(w/2, h/2, 50, w/2, h/2, w/2);
      grad.addColorStop(0, '#1E160C');
      grad.addColorStop(0.5, '#0A0908');
      grad.addColorStop(1, '#020203');
      screenCtx.fillStyle = grad;
      screenCtx.fillRect(0, 0, w, h);

      // دوائر ذهبية ناعمة متحركة بالخلفية
      screenCtx.save();
      screenCtx.lineWidth = 2;
      screenCtx.strokeStyle = 'rgba(212, 175, 55, 0.25)';
      const pulse = Math.sin(time * 1.5) * 20;
      screenCtx.beginPath();
      screenCtx.arc(w/2, h/2 - 20, 170 + pulse, 0, Math.PI * 2);
      screenCtx.stroke();

      screenCtx.strokeStyle = 'rgba(212, 175, 55, 0.15)';
      screenCtx.beginPath();
      screenCtx.arc(w/2, h/2 - 20, 210 + pulse * 1.4, 0, Math.PI * 2);
      screenCtx.stroke();
      screenCtx.restore();

      // كتابة اسم الدار الملكي
      screenCtx.textAlign = 'center';
      screenCtx.textBaseline = 'middle';
      
      screenCtx.font = '900 68px Cinzel, serif';
      screenCtx.fillStyle = '#D4AF37';
      screenCtx.shadowColor = 'rgba(212, 175, 55, 0.7)';
      screenCtx.shadowBlur = 24;
      screenCtx.fillText('la Pérla', w/2, h/2 - 35);

      screenCtx.shadowBlur = 0;
      screenCtx.font = '600 20px "Playfair Display", serif';
      screenCtx.fillStyle = '#F4E7CB';
      screenCtx.letterSpacing = '6px';
      screenCtx.fillText('MAISON DE HAUTE COUTURE • PARIS', w/2, h/2 + 35);

      screenCtx.font = '700 15px Cairo, sans-serif';
      screenCtx.fillStyle = '#AA8B42';
      screenCtx.fillText('COLLECTION 2026 • تشكيلة الرقي المعاصر', w/2, h/2 + 75);

      screenTexture.needsUpdate = true;
    }

    function createGoldDriftingParticles() {
      const particleCount = 220;
      const geometry = new THREE.BufferGeometry();
      const positions = new Float32Array(particleCount * 3);

      for (let i = 0; i < particleCount * 3; i += 3) {
        positions[i] = (Math.random() - 0.5) * 14;
        positions[i + 1] = Math.random() * 7;
        positions[i + 2] = (Math.random() - 0.5) * 28;
      }

      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      const material = new THREE.PointsMaterial({
        color: 0xD4AF37,
        size: 0.045,
        transparent: true,
        opacity: 0.65,
        blending: THREE.AdditiveBlending
      });
      particles = new THREE.Points(geometry, material);
      scene.add(particles);
    }

    // ====================================================================
    // تحميل العارضة البشرية الحقيقية مع مشية الكات ووك الكاملة (GLTF Loader)
    // ====================================================================
    function loadPhotorealisticModel() {
      const loader = new GLTFLoader();
      
      // مجسم عارضة أنثوية ذات دقة عالية مع حركة المشي المدمجة
      const modelUrl = 'https://raw.githubusercontent.com/mrdoob/three.js/master/examples/models/gltf/Xbot.glb';

      const progressEl = document.getElementById('loader-progress');
      const statusEl = document.getElementById('loader-status');

      loader.load(
        modelUrl,
        (gltf) => {
          humanModelGroup = gltf.scene;
          humanModelGroup.scale.set(1.15, 1.15, 1.15);
          humanModelGroup.position.set(0, 0, 0);

          // استخراج خامات ملابس العارضة وتجهيزها للتبديل الفوري
          garmentMaterials = [];
          humanModelGroup.traverse((child) => {
            if (child.isMesh) {
              child.castShadow = true;
              child.receiveShadow = true;

              // تطبيق خامة PBR واقعية تدعم اللمعان والشين (Sheen)
              if (child.material) {
                const newMat = new THREE.MeshPhysicalMaterial({
                  color: currentActiveDress.color,
                  roughness: currentActiveDress.roughness,
                  metalness: currentActiveDress.metalness,
                  clearcoat: currentActiveDress.clearcoat,
                  clearcoatRoughness: 0.15,
                  sheen: currentActiveDress.sheen || 0.4,
                  sheenColor: new THREE.Color(currentActiveDress.sheenColor || 0xD4AF37),
                  side: THREE.DoubleSide
                });
                child.material = newMat;
                garmentMaterials.push(newMat);
              }
            }
          });

          scene.add(humanModelGroup);

          // إعداد مشية الكات ووك بالهيكل العظمي
          if (gltf.animations && gltf.animations.length > 0) {
            animationMixer = new THREE.AnimationMixer(humanModelGroup);
            // البحث عن أنيميشن المشي
            const walkClip = gltf.animations.find(clip => clip.name.toLowerCase().includes('walk')) || gltf.animations[0];
            walkAction = animationMixer.clipAction(walkClip);
            walkAction.play();
          }

          // إخفاء شاشة التحميل بنعومة
          const loaderScreen = document.getElementById('luxury-loader');
          if (loaderScreen) {
            loaderScreen.classList.add('opacity-0', 'pointer-events-none');
            setTimeout(() => loaderScreen.remove(), 700);
          }
        },
        (xhr) => {
          if (xhr.lengthComputable) {
            const percent = Math.round((xhr.loaded / xhr.total) * 100);
            if (progressEl) progressEl.style.width = `${percent}%`;
            if (statusEl) statusEl.innerText = `تحميل تفاصيل العارضة... ${percent}%`;
          }
        },
        (error) => {
          console.error("Model load error:", error);
          if (statusEl) statusEl.innerText = 'جاري إطلاق المنصة بأعلى دقة...';
          const loaderScreen = document.getElementById('luxury-loader');
          if (loaderScreen) {
            loaderScreen.classList.add('opacity-0', 'pointer-events-none');
            setTimeout(() => loaderScreen.remove(), 700);
          }
        }
      );
    }

    // ====================================================================
    // التبديل الفوري لخامات وألوان فساتين العارضة الحقيقية
    // ====================================================================
    function applyDressToModel(garment) {
      currentActiveDress = garment;
      document.getElementById('current-dress-title').innerText = garment.title;

      garmentMaterials.forEach(mat => {
        mat.color.setHex(garment.color);
        mat.roughness = garment.roughness;
        mat.metalness = garment.metalness;
        mat.clearcoat = garment.clearcoat;
        mat.sheen = garment.sheen || 0.3;
        mat.sheenColor.setHex(garment.sheenColor || 0xD4AF37);
      });

      // وميض فلاش خفيف احتفالي عند التبديل
      triggerFlash();
      updateActiveWardrobeUI(garment.id);
    }

    function renderWardrobeUI() {
      const container = document.getElementById('wardrobe-items-container');
      container.innerHTML = DRESS_CATALOG.map((item, idx) => `
        <div onclick="window.selectDressById('${item.id}')" id="wardrobe-card-${item.id}" class="border-2 border-neutral-700 bg-black/60 rounded-xl p-1 cursor-pointer transition-all duration-300 hover:scale-105 flex flex-col items-center ${idx === 0 ? 'wardrobe-card-active' : ''}">
          <div class="w-full aspect-[3/3.8] rounded-lg overflow-hidden bg-neutral-900 mb-1">
            <img src="${item.thumb}" alt="${item.title}" class="w-full h-full object-cover">
          </div>
          <span class="text-[9px] font-black text-white truncate max-w-full text-center">${item.title.split(' ')[0]} ${item.title.split(' ')[1] || ''}</span>
        </div>
      `).join('');
    }

    function updateActiveWardrobeUI(activeId) {
      document.querySelectorAll('#wardrobe-items-container > div').forEach(el => {
        el.className = el.className.replace('wardrobe-card-active', '').trim();
      });
      const activeCard = document.getElementById(`wardrobe-card-${activeId}`);
      if (activeCard) {
        activeCard.className += ' wardrobe-card-active';
      }
    }

    window.selectDressById = function(id) {
      const found = DRESS_CATALOG.find(d => d.id === id);
      if (found) applyDressToModel(found);
    };

    // وميض فلاش المصورين الصحفيين
    function triggerFlash() {
      const flash = document.getElementById('paparazzi-flash');
      if (flash) {
        flash.style.opacity = '1';
        setTimeout(() => { flash.style.opacity = '0'; }, 90);
      }
    }

    function triggerRandomPaparazzi() {
      setInterval(() => {
        if (Math.random() > 0.45 && currentCameraMode !== 'orbit') {
          triggerFlash();
        }
      }, 3200);
    }

    // حلقة الحركة والرسم (Animation Loop)
    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      const time = clock.getElapsedTime();

      // تحديث شاشة العرض الخلفية
      updateBackdropScreen(time);

      if (animationMixer) {
        if (currentCameraMode === 'orbit') {
          // في وضع 360: العارضة ثابتة في المركز تحت دائرة الضوء الرئيسية
          animationMixer.timeScale = 0.05; // حركة تنفس هادئة جداً
          if (humanModelGroup) {
            humanModelGroup.position.z = THREE.MathUtils.lerp(humanModelGroup.position.z, 0, 0.08);
            humanModelGroup.position.x = THREE.MathUtils.lerp(humanModelGroup.position.x, 0, 0.08);
          }
        } else {
          // وضع المشي على طول المنصة
          animationMixer.timeScale = 1.0;
          walkProgress += delta * 1.1;
          const strideZ = (walkProgress % 20) - 10; // مشي من -10 إلى +10
          if (humanModelGroup) {
            humanModelGroup.position.z = strideZ;
          }
        }
        animationMixer.update(delta);
      }

      // تتبع كشاف الإضاءة للعارضة
      if (followSpotLight && humanModelGroup) {
        followSpotLight.position.z = humanModelGroup.position.z + 3.8;
        followSpotLightTarget.position.z = humanModelGroup.position.z;
      }

      if (particles) {
        particles.rotation.y = time * 0.02;
      }

      updateCameraPosition();
      renderer.render(scene, camera);
    }

    function updateCameraPosition() {
      if (!humanModelGroup) return;

      if (currentCameraMode === 'track') {
        const targetZ = humanModelGroup.position.z + 6.4;
        camera.position.z = THREE.MathUtils.lerp(camera.position.z, targetZ, 0.08);
        camera.position.x = THREE.MathUtils.lerp(camera.position.x, 0, 0.08);
        camera.position.y = THREE.MathUtils.lerp(camera.position.y, 2.1, 0.08);
        camera.lookAt(0, 1.5, humanModelGroup.position.z);
      } else if (currentCameraMode === 'low') {
        const targetZ = humanModelGroup.position.z + 5.0;
        camera.position.z = THREE.MathUtils.lerp(camera.position.z, targetZ, 0.08);
        camera.position.x = THREE.MathUtils.lerp(camera.position.x, 1.3, 0.08);
        camera.position.y = THREE.MathUtils.lerp(camera.position.y, 0.5, 0.08);
        camera.lookAt(0, 1.7, humanModelGroup.position.z);
      } else if (currentCameraMode === 'orbit') {
        controls.update();
      }
    }

    window.setCameraView = function(mode) {
      currentCameraMode = mode;
      document.querySelectorAll('footer button').forEach(b => {
        b.className = b.className.replace('bg-[#D4AF37] text-black font-black', 'text-neutral-300 hover:text-white font-bold');
      });

      const btn = document.getElementById(`btn-cam-${mode}`);
      if (btn) btn.className = "px-3 py-1.5 rounded-xl text-xs font-black bg-[#D4AF37] text-black transition flex items-center gap-1";

      if (mode === 'track') {
        controls.enabled = false;
        controls.autoRotate = false;
      } else if (mode === 'low') {
        controls.enabled = false;
        controls.autoRotate = false;
      } else if (mode === 'orbit') {
        controls.enabled = true;
        controls.autoRotate = true;
        controls.target.set(0, 1.4, 0);
      }
    };

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
  </script>
</body>
</html>
