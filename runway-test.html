<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>La PÉRLA | 3D Virtual Dressing Room & Runway</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #050507;
      color: #FAF6F0;
      font-family: 'Cairo', sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    .font-brand {
      font-family: 'Cinzel', serif;
      letter-spacing: 0.16em;
    }
    .gold-gradient-text {
      background: linear-gradient(135deg, #F9E7B9 0%, #D4AF37 50%, #AA771C 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .glass-panel {
      background: rgba(14, 14, 18, 0.82);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(212, 175, 55, 0.3);
    }
    .gold-btn {
      background: linear-gradient(135deg, #E6C264 0%, #C99E2A 100%);
      color: #261605;
      font-weight: 900;
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.35);
    }
    .gold-btn:hover {
      background: linear-gradient(135deg, #F0D07C 0%, #D4AF37 100%);
      transform: translateY(-1px);
    }
    .wardrobe-card-active {
      border-color: #D4AF37 !important;
      box-shadow: 0 0 16px rgba(212, 175, 55, 0.5) !important;
      transform: scale(1.05);
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>

  <!-- Three.js ES Module Import Map -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <!-- WebGL Render Canvas -->
  <canvas id="runway-canvas"></canvas>

  <!-- رأس المشهد: الشعار والحالة -->
  <header class="fixed top-3 inset-x-3 sm:inset-x-8 flex justify-between items-center pointer-events-none z-20">
    <div class="glass-panel px-3.5 py-1.5 sm:px-4 sm:py-2 rounded-2xl pointer-events-auto flex items-center gap-2.5 sm:gap-3">
      <div class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></div>
      <div>
        <h1 class="text-[11px] sm:text-xs font-brand gold-gradient-text font-black">LA PÉRLA HAUTE COUTURE</h1>
        <p class="text-[9px] sm:text-[10px] text-neutral-400 font-bold">غرفة القياس والعرض الافتراضية 3D</p>
      </div>
    </div>

    <!-- بطاقة القطعة الحالية وزر طلبها -->
    <div class="glass-panel px-3 py-1.5 rounded-xl pointer-events-auto flex items-center gap-2.5 text-xs font-bold">
      <div class="text-right hidden sm:block">
        <span class="text-[10px] text-neutral-400 block font-normal">القطعة المعروضة:</span>
        <span id="current-dress-title" class="text-amber-300 font-black">فستان جينز ماكسي بحزام</span>
      </div>
      <a id="buy-current-dress-btn" href="index.html" class="gold-btn px-3 py-1.5 rounded-lg text-[11px] flex items-center gap-1 shadow">
        <span>طلب القطعة 🛍️</span>
      </a>
    </div>
  </header>

  <!-- الجزء السفلي: شريط اختيار الفساتين + أزرار الكاميرا -->
  <footer class="fixed bottom-3 sm:bottom-5 inset-x-3 sm:inset-x-8 flex flex-col items-center gap-2.5 z-20 pointer-events-none">
    
    <!-- 1. شريط اختيار الفساتين لتلبيس العارضة مباشرة (Virtual Wardrobe) -->
    <div class="glass-panel p-2 sm:p-2.5 rounded-2xl pointer-events-auto max-w-xl w-full flex flex-col items-center shadow-2xl">
      <div class="w-full flex justify-between items-center px-1 mb-1.5 text-[11px] font-bold">
        <span class="text-amber-300 flex items-center gap-1">
          <i data-lucide="sparkles" class="w-3.5 h-3.5"></i> اختاري فستاناً لتلبيسه للعارضة فوراً:
        </span>
        <span class="text-neutral-400 text-[10px]" id="fps-counter">60 FPS</span>
      </div>

      <!-- شبكة بطاقات الفساتين الأربعة الحقيقية لمتجرك -->
      <div class="grid grid-cols-4 gap-2 w-full" id="wardrobe-items-container">
        <!-- تملأ بالأكواد أدناه -->
      </div>
    </div>

    <!-- 2. أزرار التحكم في زاوية الكاميرا والمشي والدوران 360 -->
    <div class="glass-panel p-1.5 rounded-2xl pointer-events-auto flex items-center gap-1.5 shadow-lg">
      <button onclick="setCameraView('track')" id="btn-cam-track" class="px-3 py-1.5 rounded-xl text-xs font-black bg-[#D4AF37] text-black transition flex items-center gap-1">
        <span>🚶‍♀️ مشية العارضة</span>
      </button>
      <button onclick="setCameraView('low')" id="btn-cam-low" class="px-3 py-1.5 rounded-xl text-xs font-bold text-neutral-300 hover:text-white transition flex items-center gap-1">
        <span>📐 زاوية كوتور</span>
      </button>
      <button onclick="setCameraView('orbit')" id="btn-cam-orbit" class="px-3 py-1.5 rounded-xl text-xs font-bold text-neutral-300 hover:text-white transition flex items-center gap-1">
        <span>🔄 تفحص 360°</span>
      </button>
    </div>

  </footer>

  <!-- 3D Engine Script -->
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // المشهد والمحرك
    let scene, camera, renderer, controls;
    let clock = new THREE.Clock();
    let currentCameraMode = 'track';
    let walkProgress = 0;

    // عناصر العارضة والملابس
    let modelGroup;
    let torso, head, rightLeg, leftLeg, rightArm, leftArm;
    let currentGarmentMeshes = []; // يحتوي أجزاء الزي الحالي (فستان أو بنطال أو تطريز)
    let followSpotLight, followSpotLightTarget;
    let particles, sparkleLight;

    // كاتالوج الفساتين الأربعة الحقيقية لدار la Pérla
    const DRESS_CATALOG = [
      {
        id: "denim",
        title: "فستان جينز ماكسي بحزام كلاسيكي",
        titleFr: "Robe Denim Chic",
        type: "dress", // فستان ماكسي
        color: 0x27436B, // أزرق جينز طبيعي
        roughness: 0.65,
        metalness: 0.05,
        clearcoat: 0.2,
        hasBelt: true,
        beltColor: 0x7A431D, // حزام جلدي كلاسيكي عسلي
        hasSleevePuffs: false,
        hasCaftanGold: false,
        thumb: "file_00000000128481f4b14a0440613fcfb4.png"
      },
      {
        id: "coord",
        title: "طقم جينز أوفر سايز أزرق ليل",
        titleFr: "Ensemble Oversize Bleu Nuit",
        type: "pantsuit", // طقم بنطال عريض + قميص
        color: 0x1B2C4B, // أزرق ليل عميق
        roughness: 0.5,
        metalness: 0.05,
        clearcoat: 0.3,
        hasBelt: false,
        hasSleevePuffs: false,
        hasCaftanGold: false,
        thumb: "file_00000000725c8230b436f78947c90bec.png"
      },
      {
        id: "bronze",
        title: "فستان ساتان برونزي بأكمام منفوخة",
        titleFr: "Robe Satin Bronze",
        type: "dress",
        color: 0x6E3E21, // ساتان برونزي شوكولا
        roughness: 0.18,
        metalness: 0.15,
        clearcoat: 0.9,
        sheen: 1.0,
        sheenColor: 0xD4AF37,
        hasBelt: true,
        beltColor: 0x5C3218,
        hasSleevePuffs: true, // أكمام منفوخة كوتور
        hasCaftanGold: false,
        thumb: "file_00000000ef8081f480c83efafe065a48.png"
      },
      {
        id: "caftan",
        title: "قفطان كوتور زيتي مطرز بالذهب",
        titleFr: "Caftan d'Apparat Brodé Or",
        type: "dress",
        color: 0x2A3D2D, // زيتي ملكي فاخر
        roughness: 0.35,
        metalness: 0.1,
        clearcoat: 0.7,
        hasBelt: true,
        beltColor: 0xD4AF37, // حزام مذهب
        hasSleevePuffs: false,
        hasCaftanGold: true, // شريط تطريز ذهبي على الصدر
        thumb: "file_000000007600824681b2f9d378c764aa.png"
      }
    ];

    let currentActiveDress = DRESS_CATALOG[0];

    init();
    animate();

    function init() {
      const canvas = document.getElementById('runway-canvas');
      
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x060608);
      scene.fog = new THREE.FogExp2(0x060608, 0.035);

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 150);
      camera.position.set(0, 2.3, 7.5);

      renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.15;

      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.autoRotate = false;
      controls.autoRotateSpeed = 1.2;
      controls.maxPolarAngle = Math.PI / 2 + 0.02;
      controls.minDistance = 2.2;
      controls.maxDistance = 10.0;
      controls.target.set(0, 1.4, 0);
      controls.enabled = false;

      setupLighting();
      buildRunwayStage();
      createGoldDriftingParticles();
      buildModelBaseSkeleton();

      // تلبيس الفستان الأول تلقائياً
      dressModel(DRESS_CATALOG[0]);
      renderWardrobeUI();

      window.addEventListener('resize', onWindowResize);
    }

    function setupLighting() {
      const ambient = new THREE.AmbientLight(0xfff6e6, 0.7);
      scene.add(ambient);

      followSpotLight = new THREE.SpotLight(0xfffaed, 240);
      followSpotLight.position.set(0, 10, 4);
      followSpotLight.angle = Math.PI / 7;
      followSpotLight.penumbra = 0.55;
      followSpotLight.decay = 2;
      followSpotLight.distance = 25;
      followSpotLight.castShadow = true;
      followSpotLight.shadow.mapSize.width = 1024;
      followSpotLight.shadow.mapSize.height = 1024;

      followSpotLightTarget = new THREE.Object3D();
      followSpotLightTarget.position.set(0, 1.4, 0);
      scene.add(followSpotLightTarget);
      followSpotLight.target = followSpotLightTarget;
      scene.add(followSpotLight);

      const rimLight = new THREE.DirectionalLight(0xD4AF37, 3.2);
      rimLight.position.set(0, 5, -8);
      scene.add(rimLight);

      const fillLightLeft = new THREE.PointLight(0xffecd1, 35, 12);
      fillLightLeft.position.set(-3, 3, 2);
      scene.add(fillLightLeft);

      const fillLightRight = new THREE.PointLight(0xD4AF37, 30, 12);
      fillLightRight.position.set(3, 3, -1);
      scene.add(fillLightRight);

      // وميض ذهبي خفيف عند تبديل الفستان
      sparkleLight = new THREE.PointLight(0xD4AF37, 0, 8);
      sparkleLight.position.set(0, 1.5, 1);
      scene.add(sparkleLight);
    }

    function buildRunwayStage() {
      const runwayGeo = new THREE.BoxGeometry(3.2, 0.35, 30);
      const runwayMat = new THREE.MeshPhysicalMaterial({
        color: 0x08080A,
        roughness: 0.12,
        metalness: 0.1,
        clearcoat: 1.0,
        clearcoatRoughness: 0.08,
        reflectivity: 0.95
      });
      const runway = new THREE.Mesh(runwayGeo, runwayMat);
      runway.position.set(0, -0.175, 0);
      runway.receiveShadow = true;
      scene.add(runway);

      const railGeo = new THREE.BoxGeometry(0.08, 0.05, 30);
      const railMat = new THREE.MeshStandardMaterial({
        color: 0xD4AF37,
        emissive: 0x856617,
        metalness: 0.9,
        roughness: 0.25
      });

      const leftRail = new THREE.Mesh(railGeo, railMat);
      leftRail.position.set(-1.62, 0.02, 0);
      scene.add(leftRail);

      const rightRail = new THREE.Mesh(railGeo, railMat);
      rightRail.position.set(1.62, 0.02, 0);
      scene.add(rightRail);

      const archGeo = new THREE.TorusGeometry(3.6, 0.06, 16, 64, Math.PI);
      const archMat = new THREE.MeshStandardMaterial({ color: 0xD4AF37, emissive: 0x594109, metalness: 0.9 });
      const arch = new THREE.Mesh(archGeo, archMat);
      arch.position.set(0, 0, -14.5);
      scene.add(arch);

      const floorGeo = new THREE.PlaneGeometry(100, 100);
      const floorMat = new THREE.MeshStandardMaterial({ color: 0x030304, roughness: 0.8 });
      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.rotation.x = -Math.PI / 2;
      floor.position.y = -0.36;
      floor.receiveShadow = true;
      scene.add(floor);
    }

    function createGoldDriftingParticles() {
      const particleCount = 200;
      const geometry = new THREE.BufferGeometry();
      const positions = new Float32Array(particleCount * 3);

      for (let i = 0; i < particleCount * 3; i += 3) {
        positions[i] = (Math.random() - 0.5) * 12;
        positions[i + 1] = Math.random() * 6;
        positions[i + 2] = (Math.random() - 0.5) * 26;
      }

      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      const material = new THREE.PointsMaterial({
        color: 0xD4AF37,
        size: 0.045,
        transparent: true,
        opacity: 0.65,
        blending: THREE.AdditiveBlending
      });
      particles = new THREE.Points(geometry, material);
      scene.add(particles);
    }

    // بناء الهيكل العظمي والتشريح الأساسي للعارضة (دون فستان)
    function buildModelBaseSkeleton() {
      modelGroup = new THREE.Group();

      const skinMat = new THREE.MeshStandardMaterial({
        color: 0xEAD8C7,
        roughness: 0.45,
        metalness: 0.05
      });

      // الجذع
      const torsoGeo = new THREE.CylinderGeometry(0.24, 0.18, 0.8, 16);
      torso = new THREE.Mesh(torsoGeo, skinMat);
      torso.position.y = 1.85;
      torso.castShadow = true;
      modelGroup.add(torso);

      // الرقبة والرأس
      const neckGeo = new THREE.CylinderGeometry(0.08, 0.09, 0.22, 16);
      const neck = new THREE.Mesh(neckGeo, skinMat);
      neck.position.y = 2.3;
      modelGroup.add(neck);

      const headGeo = new THREE.SphereGeometry(0.16, 24, 24);
      head = new THREE.Mesh(headGeo, skinMat);
      head.position.y = 2.52;
      head.scale.set(0.9, 1.15, 0.95);
      head.castShadow = true;
      modelGroup.add(head);

      const bunGeo = new THREE.SphereGeometry(0.09, 16, 16);
      const hairMat = new THREE.MeshStandardMaterial({ color: 0x1A1410, roughness: 0.7 });
      const bun = new THREE.Mesh(bunGeo, hairMat);
      bun.position.set(0, 2.7, -0.06);
      modelGroup.add(bun);

      // الأرجل
      const legGeo = new THREE.CylinderGeometry(0.075, 0.05, 1.25, 16);

      rightLeg = new THREE.Group();
      rightLeg.position.set(0.12, 1.25, 0);
      const rMesh = new THREE.Mesh(legGeo, skinMat);
      rMesh.position.y = -0.6;
      rMesh.castShadow = true;
      rightLeg.add(rMesh);
      modelGroup.add(rightLeg);

      leftLeg = new THREE.Group();
      leftLeg.position.set(-0.12, 1.25, 0);
      const lMesh = new THREE.Mesh(legGeo, skinMat);
      lMesh.position.y = -0.6;
      lMesh.castShadow = true;
      leftLeg.add(lMesh);
      modelGroup.add(leftLeg);

      // الأذرع
      const armGeo = new THREE.CylinderGeometry(0.055, 0.045, 0.85, 16);

      rightArm = new THREE.Group();
      rightArm.position.set(0.32, 2.15, 0);
      const raMesh = new THREE.Mesh(armGeo, skinMat);
      raMesh.position.y = -0.4;
      raMesh.castShadow = true;
      rightArm.add(raMesh);
      modelGroup.add(rightArm);

      leftArm = new THREE.Group();
      leftArm.position.set(-0.32, 2.15, 0);
      const laMesh = new THREE.Mesh(armGeo, skinMat);
      laMesh.position.y = -0.4;
      laMesh.castShadow = true;
      leftArm.add(laMesh);
      modelGroup.add(leftArm);

      modelGroup.position.set(0, 0, 0);
      scene.add(modelGroup);
    }

    // ================================================================
    // الدالة السحرية: تلبيس العارضة أي فستان تضغطه الزبونة فوراً
    // ================================================================
    function dressModel(garment) {
      currentActiveDress = garment;

      // 1. حذف الزي السابق من العارضة
      currentGarmentMeshes.forEach(mesh => {
        if (mesh.parent) mesh.parent.remove(mesh);
        if (mesh.geometry) mesh.geometry.dispose();
      });
      currentGarmentMeshes = [];

      // 2. إعداد خامة القماش PBR حسب نوع الفستان
      const fabricMat = new THREE.MeshPhysicalMaterial({
        color: garment.color,
        roughness: garment.roughness || 0.4,
        metalness: garment.metalness || 0.08,
        clearcoat: garment.clearcoat || 0.5,
        clearcoatRoughness: 0.12,
        sheen: garment.sheen || 0.4,
        sheenColor: new THREE.Color(garment.sheenColor || 0xD4AF37),
        side: THREE.DoubleSide
      });

      // 3. بناء مجسم الزي الجديد
      if (garment.type === 'pantsuit') {
        // --- طقم بنطال عريض (Palazzo) + قميص أوفر سايز ---
        // قميص واسع
        const shirtGeo = new THREE.CylinderGeometry(0.28, 0.38, 0.85, 24);
        const shirt = new THREE.Mesh(shirtGeo, fabricMat);
        shirt.position.y = 1.7;
        shirt.castShadow = true;
        modelGroup.add(shirt);
        currentGarmentMeshes.push(shirt);

        // بنطال بالازو ساق يمنى عريضة مثبتة في حركة الرجل
        const pantGeo = new THREE.CylinderGeometry(0.12, 0.22, 1.25, 20);
        const rPant = new THREE.Mesh(pantGeo, fabricMat);
        rPant.position.y = -0.6;
        rPant.castShadow = true;
        rightLeg.add(rPant);
        currentGarmentMeshes.push(rPant);

        // بنطال ساق يسرى
        const lPant = new THREE.Mesh(pantGeo, fabricMat);
        lPant.position.y = -0.6;
        lPant.castShadow = true;
        leftLeg.add(lPant);
        currentGarmentMeshes.push(lPant);

      } else {
        // --- فستان ماكسي / قفطان كوتور طويل ---
        const dressGeo = new THREE.CylinderGeometry(0.25, 0.76, 1.48, 32, 16, true);
        const dress = new THREE.Mesh(dressGeo, fabricMat);
        dress.position.y = 1.34;
        dress.castShadow = true;
        modelGroup.add(dress);
        currentGarmentMeshes.push(dress);

        // شريط صدر الفستان
        const bodiceGeo = new THREE.CylinderGeometry(0.255, 0.23, 0.45, 24);
        const bodice = new THREE.Mesh(bodiceGeo, fabricMat);
        bodice.position.y = 1.85;
        modelGroup.add(bodice);
        currentGarmentMeshes.push(bodice);
      }

      // إضافة الحزام إن وُجد
      if (garment.hasBelt) {
        const beltGeo = new THREE.CylinderGeometry(0.225, 0.225, 0.08, 24);
        const beltMat = new THREE.MeshStandardMaterial({
          color: garment.beltColor || 0xD4AF37,
          metalness: garment.beltColor === 0xD4AF37 ? 0.9 : 0.2,
          roughness: 0.3
        });
        const belt = new THREE.Mesh(beltGeo, beltMat);
        belt.position.y = 1.72;
        modelGroup.add(belt);
        currentGarmentMeshes.push(belt);
      }

      // أكمام منفوخة في فستان الساتان البرونزي
      if (garment.hasSleevePuffs) {
        const puffGeo = new THREE.SphereGeometry(0.12, 16, 16);
        const rPuff = new THREE.Mesh(puffGeo, fabricMat);
        rPuff.position.set(0, 0, 0);
        rightArm.add(rPuff);
        currentGarmentMeshes.push(rPuff);

        const lPuff = new THREE.Mesh(puffGeo, fabricMat);
        lPuff.position.set(0, 0, 0);
        leftArm.add(lPuff);
        currentGarmentMeshes.push(lPuff);
      }

      // تطريز الذهب في القفطان الزيتي
      if (garment.hasCaftanGold) {
        const goldTrimGeo = new THREE.PlaneGeometry(0.06, 1.45);
        const goldTrimMat = new THREE.MeshStandardMaterial({
          color: 0xD4AF37,
          emissive: 0x8A6D1B,
          metalness: 0.9,
          roughness: 0.2
        });
        const goldTrim = new THREE.Mesh(goldTrimGeo, goldTrimMat);
        goldTrim.position.set(0, 1.34, 0.45);
        modelGroup.add(goldTrim);
        currentGarmentMeshes.push(goldTrim);
      }

      // وميض ذهبي احتفالي عند اللبس
      sparkleLight.intensity = 80;
      setTimeout(() => { sparkleLight.intensity = 0; }, 350);

      // تحديث واجهة المستخدم
      document.getElementById('current-dress-title').innerText = garment.title;
      updateActiveWardrobeUI(garment.id);
    }

    // بناء شريط الكاتالوج التفاعلي أسفل المنصة
    function renderWardrobeUI() {
      const container = document.getElementById('wardrobe-items-container');
      container.innerHTML = DRESS_CATALOG.map((item, idx) => `
        <div onclick="window.selectDressById('${item.id}')" id="wardrobe-card-${item.id}" class="border-2 border-neutral-700 bg-black/60 rounded-xl p-1 cursor-pointer transition-all duration-300 hover:scale-105 flex flex-col items-center ${idx === 0 ? 'wardrobe-card-active' : ''}">
          <div class="w-full aspect-[3/3.8] rounded-lg overflow-hidden bg-neutral-900 mb-1">
            <img src="${item.thumb}" alt="${item.title}" class="w-full h-full object-cover">
          </div>
          <span class="text-[9px] font-black text-white truncate max-w-full text-center">${item.title.split(' ')[0]} ${item.title.split(' ')[1] || ''}</span>
        </div>
      `).join('');
    }

    function updateActiveWardrobeUI(activeId) {
      document.querySelectorAll('#wardrobe-items-container > div').forEach(el => {
        el.className = el.className.replace('wardrobe-card-active', '').trim();
      });
      const activeCard = document.getElementById(`wardrobe-card-${activeId}`);
      if (activeCard) {
        activeCard.className += ' wardrobe-card-active';
      }
    }

    window.selectDressById = function(id) {
      const found = DRESS_CATALOG.find(d => d.id === id);
      if (found) {
        dressModel(found);
      }
    };

    // الحركة والانيميشن
    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      const time = clock.getElapsedTime();

      if (modelGroup) {
        if (currentCameraMode === 'orbit') {
          // وضع 360: العارضة ثابتة في المركز تحت الأضواء لتفحص الفستان
          modelGroup.position.z = THREE.MathUtils.lerp(modelGroup.position.z, 0, 0.08);
          modelGroup.position.x = THREE.MathUtils.lerp(modelGroup.position.x, 0, 0.08);

          rightLeg.rotation.x = THREE.MathUtils.lerp(rightLeg.rotation.x, 0.12, 0.08);
          leftLeg.rotation.x = THREE.MathUtils.lerp(leftLeg.rotation.x, -0.08, 0.08);
          rightArm.rotation.x = THREE.MathUtils.lerp(rightArm.rotation.x, 0.05, 0.08);
          leftArm.rotation.x = THREE.MathUtils.lerp(leftArm.rotation.x, -0.05, 0.08);

          // تموج القماش مع الهواء
          currentGarmentMeshes.forEach(m => {
            m.rotation.z = Math.sin(time * 1.6) * 0.02;
          });

        } else {
          // وضع المشي على طول المنصة
          const walkSpeed = 2.4;
          walkProgress += delta * 0.95;
          const strideZ = (walkProgress % 22) - 11;
          modelGroup.position.z = strideZ;

          const legSwing = Math.sin(time * walkSpeed * 2.2) * 0.45;
          rightLeg.rotation.x = legSwing;
          leftLeg.rotation.x = -legSwing;

          rightArm.rotation.x = -legSwing * 0.65;
          leftArm.rotation.x = legSwing * 0.65;

          modelGroup.rotation.y = Math.sin(time * walkSpeed * 1.1) * 0.08;
          torso.rotation.z = Math.sin(time * walkSpeed * 2.2) * 0.035;
          modelGroup.position.y = Math.abs(Math.cos(time * walkSpeed * 2.2)) * 0.04;

          currentGarmentMeshes.forEach(m => {
            m.rotation.z = -Math.sin(time * walkSpeed * 2.2) * 0.05;
            m.rotation.x = Math.sin(time * walkSpeed * 2.2) * 0.06;
          });
        }
      }

      // توجيه الضوء
      if (followSpotLight && modelGroup) {
        followSpotLight.position.z = modelGroup.position.z + 3.5;
        followSpotLightTarget.position.z = modelGroup.position.z;
      }

      if (particles) {
        particles.rotation.y = time * 0.025;
      }

      updateCameraPosition();
      renderer.render(scene, camera);
    }

    function updateCameraPosition() {
      if (!modelGroup) return;

      if (currentCameraMode === 'track') {
        const targetZ = modelGroup.position.z + 6.2;
        camera.position.z = THREE.MathUtils.lerp(camera.position.z, targetZ, 0.08);
        camera.position.x = THREE.MathUtils.lerp(camera.position.x, 0, 0.08);
        camera.position.y = THREE.MathUtils.lerp(camera.position.y, 2.2, 0.08);
        camera.lookAt(0, 1.6, modelGroup.position.z);
      } else if (currentCameraMode === 'low') {
        const targetZ = modelGroup.position.z + 4.8;
        camera.position.z = THREE.MathUtils.lerp(camera.position.z, targetZ, 0.08);
        camera.position.x = THREE.MathUtils.lerp(camera.position.x, 1.4, 0.08);
        camera.position.y = THREE.MathUtils.lerp(camera.position.y, 0.45, 0.08);
        camera.lookAt(0, 1.8, modelGroup.position.z);
      } else if (currentCameraMode === 'orbit') {
        controls.update();
      }
    }

    window.setCameraView = function(mode) {
      currentCameraMode = mode;
      document.querySelectorAll('footer button').forEach(b => {
        b.className = b.className.replace('bg-[#D4AF37] text-black', 'text-neutral-300 hover:text-white');
      });

      const btn = document.getElementById(`btn-cam-${mode}`);
      if (btn) btn.className = "px-3 py-1.5 rounded-xl text-xs font-black bg-[#D4AF37] text-black transition flex items-center gap-1";

      if (mode === 'track') {
        controls.enabled = false;
        controls.autoRotate = false;
      } else if (mode === 'low') {
        controls.enabled = false;
        controls.autoRotate = false;
      } else if (mode === 'orbit') {
        controls.enabled = true;
        controls.autoRotate = true;
        controls.target.set(0, 1.4, 0);
      }
    };

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
  </script>
</body>
</html>
