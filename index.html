<!-- نموذج الطلب الفاخر La PÉRLA -->
<div id="laperla-order-container" style="max-width: 620px; margin: 30px auto; background: #0c0c0e; border: 1px solid rgba(212, 175, 55, 0.4); border-radius: 24px; padding: 25px; color: #fff; font-family: 'Cairo', sans-serif; direction: rtl; box-shadow: 0 10px 50px rgba(0,0,0,0.9);">
  
  <div style="text-align: center; margin-bottom: 25px;">
    <h2 style="color: #d4af37; font-size: 24px; font-weight: 800; margin: 0;">استمارة تأكيد الطلب 🛍️</h2>
    <p style="color: #a1a1aa; font-size: 13px; margin-top: 5px;">الدفع عند الاستلام مع المعاينة قبل الدفع</p>
  </div>

  <form id="laperlaOrderForm">
    
    <!-- 1. الاسم واللقب -->
    <div style="margin-bottom: 15px;">
      <label style="display: block; font-size: 13px; color: #f4e8c1; margin-bottom: 6px; font-weight: 600;">الاسم واللقب *</label>
      <input type="text" id="custName" required placeholder="مثال: سارة بوعلام" style="width: 100%; padding: 12px; background: #18181b; border: 1px solid #3f3f46; border-radius: 12px; color: #fff; font-size: 14px; outline: none; box-sizing: border-box;">
    </div>

    <!-- 2. رقم الهاتف مع التعرف التلقائي على المتعامل -->
    <div style="margin-bottom: 15px;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
        <label style="font-size: 13px; color: #f4e8c1; font-weight: 600;">رقم الهاتف (10 أرقام) *</label>
        <span id="operatorBadge" style="font-size: 11px; padding: 2px 8px; border-radius: 6px; display: none; font-weight: bold;"></span>
      </div>
      <input type="tel" id="custPhone" maxlength="10" required placeholder="05 / 06 / 07XXXXXXXX" style="width: 100%; padding: 12px; background: #18181b; border: 1px solid #3f3f46; border-radius: 12px; color: #fff; font-size: 15px; outline: none; box-sizing: border-box; text-align: left; direction: ltr; font-weight: bold; letter-spacing: 1px;">
      <small id="phoneError" style="color: #ef4444; font-size: 11px; display: none; margin-top: 4px;">⚠️ يجب إدخال 10 أرقام تبدأ بـ 05 (أوريدو) أو 06 (موبيليس) أو 07 (جيزي)</small>
    </div>

    <!-- 3. المقاس واللون -->
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px;">
      <div>
        <label style="display: block; font-size: 13px; color: #f4e8c1; margin-bottom: 6px; font-weight: 600;">المقاس (Taille)</label>
        <select id="prodSize" style="width: 100%; padding: 11px; background: #18181b; border: 1px solid #3f3f46; border-radius: 12px; color: #fff; font-size: 13px; outline: none; box-sizing: border-box;">
          <option value="Standard">Standard (قياسي)</option>
          <option value="S">S (36 - 38)</option>
          <option value="M">M (38 - 40)</option>
          <option value="L">L (40 - 42)</option>
          <option value="XL">XL (42 - 44)</option>
          <option value="XXL">XXL (44 - 46)</option>
        </select>
      </div>

      <div>
        <label style="display: block; font-size: 13px; color: #f4e8c1; margin-bottom: 6px; font-weight: 600;">اللون المفضل</label>
        <select id="prodColor" style="width: 100%; padding: 11px; background: #18181b; border: 1px solid #3f3f46; border-radius: 12px; color: #fff; font-size: 13px; outline: none; box-sizing: border-box;">
          <option value="أسود ملكي">أسود ملكي 🖤</option>
          <option value="عنابي فاخر">عنابي فاخر (Bordeaux) 🍷</option>
          <option value="أزرق ليل">أزرق ليل (Bleu Nuit) 🌌</option>
          <option value="بيج ذهبي">بيج ذهبي (Nude) ✨</option>
          <option value="أخضر زمردي">أخضر زمردي 💚</option>
        </select>
      </div>
    </div>

    <!-- 4. الكمية (من 1 إلى 10) -->
    <div style="margin-bottom: 15px;">
      <label style="display: block; font-size: 13px; color: #f4e8c1; margin-bottom: 6px; font-weight: 600;">الكمية المطلوبة</label>
      <select id="prodQuantity" onchange="updateTotalSummary()" style="width: 100%; padding: 11px; background: #18181b; border: 1px solid #3f3f46; border-radius: 12px; color: #fff; font-size: 14px; font-weight: bold; outline: none; box-sizing: border-box;">
        <option value="1">1 قطعة</option>
        <option value="2">2 قطع</option>
        <option value="3">3 قطع</option>
        <option value="4">4 قطع</option>
        <option value="5">5 قطع</option>
        <option value="6">6 قطع</option>
        <option value="7">7 قطع</option>
        <option value="8">8 قطع</option>
        <option value="9">9 قطع</option>
        <option value="10">10 قطع</option>
      </select>
    </div>

    <!-- 5. الولايات والبلديات (الـ 58 ولاية والـ 1541 بلدية) -->
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px;">
      <div>
        <label style="display: block; font-size: 13px; color: #f4e8c1; margin-bottom: 6px; font-weight: 600;">الولاية (58 ولاية) *</label>
        <select id="custWilaya" onchange="onWilayaChange()" required style="width: 100%; padding: 11px; background: #18181b; border: 1px solid #3f3f46; border-radius: 12px; color: #fff; font-size: 13px; outline: none; box-sizing: border-box;">
          <option value="">اختر الولاية...</option>
        </select>
      </div>

      <div>
        <label style="display: block; font-size: 13px; color: #f4e8c1; margin-bottom: 6px; font-weight: 600;">
          البلدية * <span id="communeLoading" style="font-size: 10px; color: #eab308; display: none;">(جاري التحميل...)</span>
        </label>
        <select id="custCommune" required style="width: 100%; padding: 11px; background: #18181b; border: 1px solid #3f3f46; border-radius: 12px; color: #fff; font-size: 13px; outline: none; box-sizing: border-box;">
          <option value="">اختر الولاية أولاً</option>
        </select>
      </div>
    </div>

    <!-- 6. خيار التوصيل: للمنزل أو للمكتب -->
    <div style="margin-bottom: 20px;">
      <label style="display: block; font-size: 13px; color: #f4e8c1; margin-bottom: 8px; font-weight: 600;">طريقة الاستلام والتوصيل *</label>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <label style="display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px; background: #18181b; border: 1px solid #d4af37; border-radius: 12px; cursor: pointer; font-size: 13px; font-weight: bold;">
          <input type="radio" name="deliveryType" value="home" checked onchange="updateTotalSummary()">
          <span>🏠 توصيل للمنزل</span>
        </label>
        <label style="display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px; background: #18181b; border: 1px solid #3f3f46; border-radius: 12px; cursor: pointer; font-size: 13px; font-weight: bold;">
          <input type="radio" name="deliveryType" value="desk" onchange="updateTotalSummary()">
          <span>🏢 استلام من المكتب</span>
        </label>
      </div>
    </div>

    <!-- 7. بطاقة الحساب المالي الشامل -->
    <div style="background: rgba(212, 175, 55, 0.08); border: 1px dashed #d4af37; border-radius: 16px; padding: 16px; margin-bottom: 20px; font-size: 14px;">
      <div style="display: flex; justify-content: space-between; margin-bottom: 8px; color: #d4d4d8;">
        <span>سعر المنتجات:</span>
        <span id="displayBasePrice">8,500 دج</span>
      </div>
      <div style="display: flex; justify-content: space-between; margin-bottom: 8px; color: #d4d4d8;">
        <span>تكلفة الشحن:</span>
        <span id="displayShippingPrice">اختر الولاية</span>
      </div>
      <hr style="border: none; border-top: 1px solid rgba(212, 175, 55, 0.25); margin: 10px 0;">
      <div style="display: flex; justify-content: space-between; font-size: 18px; font-weight: 900; color: #facc15;">
        <span>المجموع الإجمالي:</span>
        <span id="displayTotalPrice">8,500 دج</span>
      </div>
    </div>

    <!-- 8. زر التأكيد -->
    <button type="submit" id="submitOrderBtn" style="width: 100%; padding: 16px; background: linear-gradient(135deg, #dfba73 0%, #c59d4c 50%, #9e782f 100%); border: none; border-radius: 14px; color: #000; font-size: 16px; font-weight: 900; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 20px rgba(212, 175, 55, 0.35);">
      تأكيد الطلب الفوري عبر واتساب ⚡
    </button>

  </form>
</div>

<script>
// ==============================================================
// 1. الإعدادات
// ==============================================================
const MY_WHATSAPP_NUMBER = "213778215570"; // رقم هاتفك
const PRODUCT_BASE_PRICE = 8500;            // سعر القطعة الواحدة بالدينار الجزائري
const PRODUCT_NAME = "قطعة فاخرة La PÉRLA";

// ==============================================================
// 2. قائمة الـ 58 ولاية مع أسعار التوصيل (مكتب / منزل)
// ==============================================================
const algeriaWilayas = [
  { code: 1, name: "01 - أدرار", desk: 900, home: 1400 },
  { code: 2, name: "02 - الشلف", desk: 400, home: 600 },
  { code: 3, name: "03 - الأغواط", desk: 550, home: 800 },
  { code: 4, name: "04 - أم البواقي", desk: 450, home: 700 },
  { code: 5, name: "05 - باتنة", desk: 400, home: 650 },
  { code: 6, name: "06 - بجاية", desk: 400, home: 650 },
  { code: 7, name: "07 - بسكرة", desk: 500, home: 750 },
  { code: 8, name: "08 - بشار", desk: 700, home: 1000 },
  { code: 9, name: "09 - البليدة", desk: 350, home: 500 },
  { code: 10, name: "10 - البويرة", desk: 400, home: 600 },
  { code: 11, name: "11 - تمنراست", desk: 1000, home: 1600 },
  { code: 12, name: "12 - تبسة", desk: 450, home: 700 },
  { code: 13, name: "13 - تلمسان", desk: 400, home: 650 },
  { code: 14, name: "14 - تيارت", desk: 450, home: 700 },
  { code: 15, name: "15 - تيزي وزو", desk: 400, home: 600 },
  { code: 16, name: "16 - الجزائر العاصمة", desk: 300, home: 450 },
  { code: 17, name: "17 - الجلفة", desk: 500, home: 750 },
  { code: 18, name: "18 - جيجل", desk: 400, home: 650 },
  { code: 19, name: "19 - سطيف", desk: 400, home: 650 },
  { code: 20, name: "20 - سعيدة", desk: 450, home: 700 },
  { code: 21, name: "21 - سكيكدة", desk: 400, home: 650 },
  { code: 22, name: "22 - سيدي بلعباس", desk: 400, home: 650 },
  { code: 23, name: "23 - عنابة", desk: 400, home: 650 },
  { code: 24, name: "24 - قالمة", desk: 450, home: 700 },
  { code: 25, name: "25 - قسنطينة", desk: 400, home: 650 },
  { code: 26, name: "26 - المدية", desk: 400, home: 600 },
  { code: 27, name: "27 - مستغانم", desk: 400, home: 650 },
  { code: 28, name: "28 - المسيلة", desk: 450, home: 700 },
  { code: 29, name: "29 - معسكر", desk: 400, home: 650 },
  { code: 30, name: "30 - ورقلة", desk: 600, home: 900 },
  { code: 31, name: "31 - وهران", desk: 350, home: 500 },
  { code: 32, name: "32 - البيض", desk: 550, home: 800 },
  { code: 33, name: "33 - إليزي", desk: 1000, home: 1500 },
  { code: 34, name: "34 - برج بوعريريج", desk: 400, home: 650 },
  { code: 35, name: "35 - بومرداس", desk: 350, home: 500 },
  { code: 36, name: "36 - الطارف", desk: 450, home: 700 },
  { code: 37, name: "37 - تندوف", desk: 1000, home: 1500 },
  { code: 38, name: "38 - تسمسيلت", desk: 450, home: 700 },
  { code: 39, name: "39 - الوادي", desk: 600, home: 900 },
  { code: 40, name: "40 - خنشلة", desk: 450, home: 700 },
  { code: 41, name: "41 - سوق أهراس", desk: 450, home: 700 },
  { code: 42, name: "42 - تيبازة", desk: 350, home: 500 },
  { code: 43, name: "43 - ميلة", desk: 400, home: 650 },
  { code: 44, name: "44 - عين الدفلى", desk: 400, home: 600 },
  { code: 45, name: "45 - النعامة", desk: 600, home: 900 },
  { code: 46, name: "46 - عين تموشنت", desk: 400, home: 650 },
  { code: 47, name: "47 - غرداية", desk: 550, home: 850 },
  { code: 48, name: "48 - غليزان", desk: 400, home: 650 },
  { code: 49, name: "49 - تيميمون", desk: 900, home: 1400 },
  { code: 50, name: "50 - برج باجي مختار", desk: 1100, home: 1600 },
  { code: 51, name: "51 - أولاد جلال", desk: 550, home: 800 },
  { code: 52, name: "52 - بني عباس", desk: 850, home: 1200 },
  { code: 53, name: "53 - عين صالح", desk: 950, home: 1450 },
  { code: 54, name: "54 - عين قزام", desk: 1100, home: 1600 },
  { code: 55, name: "55 - تقرت", desk: 600, home: 900 },
  { code: 56, name: "56 - جانت", desk: 1000, home: 1500 },
  { code: 57, name: "57 - المغير", desk: 600, home: 850 },
  { code: 58, name: "58 - المنيعة", desk: 700, home: 1000 }
];

// ملء قائمة الولايات في الصفحة
const wilayaSelect = document.getElementById("custWilaya");
algeriaWilayas.forEach(w => {
  const opt = document.createElement("option");
  opt.value = w.code;
  opt.textContent = w.name;
  wilayaSelect.appendChild(opt);
});

// ==============================================================
// 3. الجلب التلقائي لكل الـ 1541 بلدية من قاعدة البيانات السحابية
// ==============================================================
let allCommunesData = [];
const loadingIndicator = document.getElementById("communeLoading");
loadingIndicator.style.display = "inline";

// جلب البلديات في الخلفية بدون تأخير المتصفح
fetch("https://cdn.jsdelivr.net/npm/geoalgeria/data/ecommerce/communes.json")
  .then(res => res.json())
  .then(data => {
    allCommunesData = data;
    loadingIndicator.style.display = "none";
  })
  .catch(err => {
    console.warn("جاري استخدام الرابط البديل للبلديات...");
    // رابط احتياطي إن دعت الحاجة
    fetch("https://raw.githubusercontent.com/ilies-space/algeria-cities-json/main/algeria-cities.json")
      .then(r => r.json())
      .then(d => { allCommunesData = d; loadingIndicator.style.display = "none"; })
      .catch(() => { loadingIndicator.style.display = "none"; });
  });

// عند اختيار ولاية -> تحديث بلدياتها فوراً
function onWilayaChange() {
  const wilayaCode = parseInt(wilayaSelect.value);
  const communeSelect = document.getElementById("custCommune");
  communeSelect.innerHTML = '<option value="">اختر البلدية...</option>';

  if (!wilayaCode) {
    updateTotalSummary();
    return;
  }

  // فلترة البلديات التابعة للولاية المختارة
  const filtered = allCommunesData.filter(c => {
    const cWilaya = parseInt(c.wilaya_code || c.wilaya_id || (c.code ? c.code.substring(0, 2) : 0));
    return cWilaya === wilayaCode;
  });

  if (filtered.length > 0) {
    filtered.forEach(item => {
      const opt = document.createElement("option");
      const name = item.commune_ar || item.name_ar || item.commune_name || item.commune;
      opt.value = name;
      opt.textContent = name;
      communeSelect.appendChild(opt);
    });
  } else {
    // حل بديل سريع في حال كان الإنترنت بطيئاً جداً
    const opt = document.createElement("option");
    opt.value = "البلدية المركزية";
    opt.textContent = "البلدية المركزية (أو سيتم التأكيد هاتفياً)";
    communeSelect.appendChild(opt);
  }

  updateTotalSummary();
}

// ==============================================================
// 4. الحساب المالي الآلي الشامل
// ==============================================================
function updateTotalSummary() {
  const qty = parseInt(document.getElementById("prodQuantity").value) || 1;
  const wilayaCode = parseInt(wilayaSelect.value);
  const deliveryType = document.querySelector('input[name="deliveryType"]:checked').value;
  
  let shippingCost = 0;
  const selectedWilaya = algeriaWilayas.find(w => w.code === wilayaCode);
  
  if (selectedWilaya) {
    shippingCost = (deliveryType === "desk") ? selectedWilaya.desk : selectedWilaya.home;
  }

  const itemsTotal = PRODUCT_BASE_PRICE * qty;
  const grandTotal = itemsTotal + shippingCost;

  document.getElementById("displayBasePrice").innerText = `${itemsTotal.toLocaleString()} دج (${qty} قطع)`;
  document.getElementById("displayShippingPrice").innerText = selectedWilaya ? `${shippingCost.toLocaleString()} دج` : "اختر الولاية";
  document.getElementById("displayTotalPrice").innerText = `${grandTotal.toLocaleString()} دج`;
}

// ==============================================================
// 5. التحقق الذكي من رقم الهاتف الجزائري (جيزي - موبيليس - أوريدو)
// ==============================================================
const phoneInput = document.getElementById("custPhone");
const badge = document.getElementById("operatorBadge");

phoneInput.addEventListener("input", function() {
  // منع الحروف والرموز والتقيد بـ 10 أرقام
  this.value = this.value.replace(/[^0-9]/g, '').slice(0, 10);
  
  const val = this.value;
  if (val.startsWith("07")) {
    badge.style.display = "inline";
    badge.innerText = "جيزي Djezzy";
    badge.style.background = "#e11d48";
    badge.style.color = "#fff";
  } else if (val.startsWith("06")) {
    badge.style.display = "inline";
    badge.innerText = "موبيليس Mobilis";
    badge.style.background = "#16a34a";
    badge.style.color = "#fff";
  } else if (val.startsWith("05")) {
    badge.style.display = "inline";
    badge.innerText = "أوريدو Ooredoo";
    badge.style.background = "#dc2626";
    badge.style.color = "#fff";
  } else {
    badge.style.display = "none";
  }
});

function isValidDzPhone(num) {
  return /^(05|06|07)[0-9]{8}$/.test(num);
}

// ==============================================================
// 6. إرسال الطلب وحفظه في لوحة التحكم وتوجيهه للواتساب
// ==============================================================
document.getElementById("laperlaOrderForm").addEventListener("submit", function(e) {
  e.preventDefault();

  const phone = phoneInput.value.trim();
  const phoneErr = document.getElementById("phoneError");

  if (!isValidDzPhone(phone)) {
    phoneErr.style.display = "block";
    phoneInput.focus();
    return;
  }
  phoneErr.style.display = "none";

  const name = document.getElementById("custName").value.trim();
  const size = document.getElementById("prodSize").value;
  const color = document.getElementById("prodColor").value;
  const qty = document.getElementById("prodQuantity").value;
  const wilayaCode = parseInt(wilayaSelect.value);
  const commune = document.getElementById("custCommune").value;
  const isDesk = document.querySelector('input[name="deliveryType"]:checked').value === "desk";
  const deliveryType = isDesk ? "استلام من المكتب (Stop Desk)" : "توصيل للمنزل";
  
  const selectedWilaya = algeriaWilayas.find(w => w.code === wilayaCode);
  const wilayaName = selectedWilaya ? selectedWilaya.name : "غير محدد";
  const shippingCost = selectedWilaya ? (isDesk ? selectedWilaya.desk : selectedWilaya.home) : 0;
  const grandTotal = (PRODUCT_BASE_PRICE * parseInt(qty)) + shippingCost;
  const orderDate = new Date().toLocaleDateString("ar-DZ") + " " + new Date().toLocaleTimeString("ar-DZ");

  // 1. الحفظ الداخلي الدقيق للوحة التحكم dashboard.html
  const newOrder = {
    "الاسم": name,
    "الهاتف": phone,
    "الولاية/العنوان": `${wilayaName} - بلدية: ${commune} (${deliveryType})`,
    "المنتج": `${PRODUCT_NAME} [اللون: ${color} | المقاس: ${size} | الكمية: ${qty}]`,
    "السعر": `${grandTotal.toLocaleString()}`,
    "التاريخ": orderDate,
    "الحالة": "قيد الانتظار"
  };

  let orders = JSON.parse(localStorage.getItem("laperla_orders")) || [];
  orders.unshift(newOrder);
  localStorage.setItem("laperla_orders", JSON.stringify(orders));

  // 2. تجهيز رسالة WhatsApp الواضحة والمنظمة
  const whatsappMsg = 
    `✨ *طلب جديد من متجر La PÉRLA* ✨%0A%0A` +
    `👤 *اسم الزبونة:* ${name}%0A` +
    `📞 *رقم الهاتف:* ${phone}%0A` +
    `👗 *المنتج:* ${PRODUCT_NAME}%0A` +
    `🎨 *اللون:* ${color}%0A` +
    `📏 *المقاس:* ${size}%0A` +
    `🔢 *الكمية:* ${qty} قطع%0A` +
    `📍 *الولاية والبلدية:* ${wilayaName} - ${commune}%0A` +
    `🚚 *طريقة الاستلام:* ${deliveryType} (${shippingCost} دج)%0A` +
    `💰 *المجموع الإجمالي الواجب دفعه:* *${grandTotal.toLocaleString()} دج*%0A` +
    `🕒 *توقيت الطلب:* ${orderDate}`;

  // 3. فتح تطبيق واتساب مباشرة موجهاً لرقمك
  window.location.href = `https://wa.me/${MY_WHATSAPP_NUMBER}?text=${whatsappMsg}`;
});
</script>
